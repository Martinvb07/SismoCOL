<!doctype html>
<html lang="es-CO">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SismoCol: análisis de actividad sísmica en Colombia" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>SismoCol</title>
    <script>
      // Tema y lateral antes de pintar, para que no parpadee (ver src/componentes/layout/preferencias.ts).
      (function () {
        var raiz = document.documentElement;
        try {
          var tema = localStorage.getItem('sismocol.tema');
          if (!tema) tema = matchMedia('(prefers-color-scheme: dark)').matches ? 'oscuro' : 'claro';
          raiz.dataset.tema = tema;
          if (localStorage.getItem('sismocol.lateral') === 'mini') raiz.dataset.lateral = 'mini';
        } catch (e) {
          raiz.dataset.tema = 'claro';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
