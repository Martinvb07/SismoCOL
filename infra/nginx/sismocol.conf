# Nginx para SismoCol en el VPS.
#   sudo cp infra/nginx/sismocol.conf /etc/nginx/sites-available/sismocol
#   sudo ln -s /etc/nginx/sites-available/sismocol /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d sismocol.trabajosucc.com     # HTTPS (agrega el bloque 443)
#
# El frontend se compila con VITE_API_URL vacía: llama a /api en el mismo origen.
# El servicio analítico (8100) no se expone: solo la API le habla por 127.0.0.1.

server {
    listen 80;
    listen [::]:80;
    server_name sismocol.trabajosucc.com;

    root /var/www/SismoCOL/Frontend/dist;
    index index.html;

    # Carga de Excel/CSV (UPLOAD_MAX_MB=25) con margen.
    client_max_body_size 30m;

    location /api/ {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Carga del Excel completo y entrenamiento del modelo tardan minutos.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Archivos con hash de Vite: caché larga.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA (react-router): cualquier ruta desconocida devuelve index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
