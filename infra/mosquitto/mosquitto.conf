# Mosquitto 2.x para SismoCol (desarrollo y VPS).
# Copiar a /etc/mosquitto/conf.d/sismocol.conf en Linux, o pasar con -c en Windows.

# persistence y persistence_location ya vienen en /etc/mosquitto/mosquitto.conf
# (Ubuntu); repetirlos aquí impide que Mosquitto arranque.

# Sin acceso anónimo. Crear usuarios con:
#   mosquitto_passwd -c /etc/mosquitto/passwd sismocol-api
#   mosquitto_passwd    /etc/mosquitto/passwd sismocol-esp32
allow_anonymous false
password_file /etc/mosquitto/passwd
# Cada usuario solo usa sus tópicos (infra/mosquitto/acl).
acl_file /etc/mosquitto/acl

listener 1883
# En producción, si el ESP32 se conecta desde fuera del VPS, abrir 1883 solo
# a esa IP en el firewall o usar TLS (listener 8883 + certfile/keyfile).

log_type error
log_type warning
log_type notice
