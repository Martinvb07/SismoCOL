; Firmware del prototipo de simulación de SismoCol.
; Compilar: pio run    ·  Cargar: pio run -t upload    ·  Monitor: pio device monitor
[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@2.8
    bblanchon/ArduinoJson@7.2.1
build_flags =
    -D MQTT_MAX_PACKET_SIZE=512
