name: CI y Deploy a VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

# Nunca dos deploys simultáneos sobre el mismo servidor.
concurrency:
  group: deploy-produccion
  cancel-in-progress: false

jobs:
  ci:
    name: Build, lint y pruebas
    runs-on: ubuntu-latest
    env:
      # prisma.config.ts exige DATABASE_URL incluso para `prisma generate`
      # (postinstall). No se conecta: basta un valor con formato válido.
      DATABASE_URL: mysql://ci:ci@localhost:3306/ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20 + caché de npm
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            Backend/package-lock.json
            Frontend/package-lock.json

      - name: Python 3.12 (la del VPS, Ubuntu 24.04) + caché de pip
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Analytics/requirements.txt

      - name: Backend — dependencias y build
        working-directory: Backend
        run: |
          npm ci
          npm run build

      - name: Frontend — dependencias, lint, pruebas y build
        working-directory: Frontend
        run: |
          npm ci
          npm run lint
          npm test
          npm run build

      - name: Analytics — dependencias y pruebas
        working-directory: Analytics
        run: |
          python -m pip install -r requirements.txt
          python -m pytest

  desplegar:
    name: Desplegar en VPS
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: produccion
    steps:
      - name: Preparar clave SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # ssh-keyscan falla de forma intermitente desde los runners:
          # reintentar hasta 5 veces antes de rendirse.
          exito=""
          for intento in 1 2 3 4 5; do
            if ssh-keyscan -T 10 -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null; then
              exito=1
              break
            fi
            echo "ssh-keyscan intento $intento fallido; reintentando en 5s..."
            sleep 5
          done
          if [ -z "$exito" ]; then
            echo "ssh-keyscan fallo tras 5 intentos"
            exit 1
          fi

      - name: Actualizar código, construir y recargar PM2
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=15 \
              "$VPS_USER@$VPS_HOST" \
              "VPS_PATH='$VPS_PATH' GIT_SHA='${{ github.sha }}' bash -s" <<'ENDSSH'
          set -euo pipefail
          cd "$VPS_PATH"

          # Versión actual, por si hay que revertir.
          ANTERIOR="$(git rev-parse HEAD)"

          construir() {
            (cd Backend && npm ci && npm run build)
            # VITE_API_URL vacía = mismo origen: Nginx pasa /api a la API.
            printf 'VITE_API_URL=\nVITE_USAR_MOCKS=false\n' > Frontend/.env.production
            (cd Frontend && npm ci && npm run build)
            (cd Analytics \
              && { [ -x .venv/bin/python ] || python3 -m venv .venv; } \
              && .venv/bin/python -m pip install -q -r requirements.txt)
          }

          migrar() {
            (cd Backend && npx prisma migrate deploy)
          }

          recargar_pm2() {
            pm2 startOrReload ecosystem.config.js --update-env
            pm2 save
          }

          # Espera hasta ~36s a que la URL responda 200.
          verificar() {
            local url="$1" intentos=0 codigo
            while true; do
              codigo=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "$url" || echo 000)
              [ "$codigo" = "200" ] && return 0
              intentos=$((intentos + 1))
              [ "$intentos" -ge 12 ] && { echo "!! $url respondio $codigo"; return 1; }
              sleep 3
            done
          }

          git fetch --prune origin
          git reset --hard "$GIT_SHA"
          # -fd no toca archivos ignorados (.env, node_modules, .venv, dist, models).
          git clean -fd

          construir
          # Las migraciones no se revierten solas: si fallan, el deploy se
          # detiene antes de recargar PM2 y sigue corriendo la versión anterior.
          migrar
          recargar_pm2

          # Health checks: API (con MySQL) y servicio analítico. Si algo falla,
          # se reconstruye la versión anterior y se recarga PM2.
          if ! verificar "http://127.0.0.1:4100/api/health" || ! verificar "http://127.0.0.1:8100/health"; then
            echo "!! Health check fallido — revirtiendo a $ANTERIOR"
            git reset --hard "$ANTERIOR"
            git clean -fd
            construir
            recargar_pm2
            exit 1
          fi

          echo "OK — desplegado $(git rev-parse --short HEAD)"
          ENDSSH

      - name: Limpiar credenciales
        if: always()
        run: rm -f ~/.ssh/deploy_key
